<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#3a1710">
<title>ركن البشوات — لوحة المدير</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="admin">

<div class="gate" id="adminGate"><div class="w-card g-card">
<img src="logo.png" alt="" class="g-logo">
<h2>🖥️ لوحة المدير</h2>
<p class="g-sub">خاصة بإدارة ركن البشوات فقط</p>
<input type="password" id="adminPass" placeholder="كلمة السر">
<button class="w-btn" onclick="adminLogin()">🔓 دخول</button>
</div></div>

<div id="adminDash" hidden>
<header class="dash-head">
<div class="dh-title">🖥️ لوحة المدير <span class="conn">🔴 اتصال…</span></div>
<div class="dh-btns"><a class="w-btn small" href="index.html">🥙 المنيو</a><button class="w-btn small danger" id="adminLogout">🚪 خروج</button></div>
</header>
<div id="adminStats"></div>
<div id="adminList"></div>
</div>

<div id="trackOv"><div class="w-card">
<button class="w-close" onclick="closeTrack()">✕</button>
<h2 id="trTitle">تتبع الطلب</h2>
<div id="tl"></div><div id="trReason"></div><div id="cmap"></div>
<div class="tr-btns"><button class="w-btn" onclick="closeTrack()">إغلاق</button></div>
</div></div>

<div id="toast"><span id="toastMsg"></span></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
